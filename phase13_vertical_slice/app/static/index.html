<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareFlow — Vertical Slice</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f6f8f9;color:#12202a;margin:0}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.card{background:#fff;border:1px solid #e2e8eb;border-radius:14px;padding:18px;box-shadow:0 8px 25px #12202a0a}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#69767e;font-size:13px}.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#fff4d7;color:#8a6000}.critical{background:#fff0ee;color:#b42318}.success{background:#e9f6ef;color:#166b42}.item{border:1px solid #e3e8eb;border-radius:10px;padding:11px;margin:9px 0}.item small{display:block;color:#6b7880;margin-top:4px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;background:#0f6b68;color:#fff}.secondary{background:#fff;color:#1a2b35;border:1px solid #d8e0e4}.timeline{margin:14px 0;border-left:2px solid #d9e2e4;padding-left:18px}.event{margin-bottom:15px}.event b{font-size:13px}.event small{display:block;color:#77838a;margin-top:3px}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:15px}}</style></head><body><main><div class="row"><div><h1>CareFlow</h1><div class="muted">Working vertical slice · synthetic data</div></div><span id="status" class="badge success">Backend connected</span></div><br><div class="grid"><section class="card"><div class="row"><div><h2>Meenakshi R.</h2><div class="muted">54 · NCD · Journey</div></div><span id="state" class="badge critical">REFERRAL_REQUIRED</span></div><p class="muted">Live state and event timeline from the local backend.</p><div id="timeline" class="timeline"></div><div class="row"><button onclick="accept()">Accept referral</button><button class="secondary" onclick="match()">Find facility</button></div></section><section class="card"><h2>Facility match</h2><div id="facilities" class="muted">Click Find facility</div></section></div><br><section class="card"><h2>Next action</h2><div id="next" class="item"><b>Confirm receiving facility</b><small>Referral is awaiting acceptance.</small></div></section><script>let jid,rid;async function api(u,o){let r=await fetch(u,o);if(!r.ok)throw Error(await r.text());return r.json()}async function boot(){let d=await api('/api/demo');jid=d.journey_id;rid=d.referral_id;await load()}async function load(){let d=await api('/api/journeys/'+jid);document.getElementById('state').textContent=d.journey.state;document.getElementById('timeline').innerHTML=d.events.map(e=>`<div class="event"><b>${e.event_type}</b><small>${e.source_system||''} · ${new Date(e.occurred_at).toLocaleString()}</small></div>`).join('');let s=d.journey.state;document.getElementById('next').innerHTML=s==='REFERRAL_REQUIRED'?'<b>Confirm receiving facility</b><small>Referral is awaiting acceptance.</small>':s==='REFERRAL_ACCEPTED'?'<b>Secure an appointment</b><small>The facility has accepted the referral.</small>':'<b>Continue journey</b><small>Current state: '+s+'</small>'}async function accept(){await api('/api/referrals/'+rid+'/accept',{method:'POST'});await load()}async function match(){let fs=await api('/api/facilities/search?required=Medicine,HbA1c,RenalFunction');document.getElementById('facilities').innerHTML=fs.map(f=>`<div class="item"><div class="row"><b>${f.facility_name}</b><b>${f.score}</b></div><small>${f.capabilities.join(' · ')} · ${f.distance_km} km</small><small>${f.availability_note}</small><button style="margin-top:7px" onclick="attach('${f.facility_id}')">Select</button></div>`).join('')}async function attach(fid){await api('/api/referrals/'+rid+'/appointment?facility_ref='+encodeURIComponent(fid),{method:'POST'});await load()}boot().catch(e=>{document.getElementById('status').textContent='Backend error';document.getElementById('status').className='badge critical'})</script></main></body></html>
