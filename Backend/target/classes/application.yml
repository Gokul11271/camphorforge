spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careflow}
    username: ${DB_USER:careflow}
    password: ${DB_PASSWORD:careflow_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
